name: Zero-Trust DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; individual jobs widen scope only as needed.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  # Set these as repository VARIABLES from `terraform output`.
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  COSIGN_VERSION: v2.4.1

jobs:
  # ─────────────────────────── GATE 1 ───────────────────────────
  sast:
    name: "Gate 1 - SAST & Lint (Semgrep + go vet)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: app/go.sum

      - name: go vet + unit tests (race)
        working-directory: app
        run: |
          go vet ./...
          go test ./... -race -count=1

      - name: Semgrep scan (SARIF)
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/golang
            p/dockerfile
            p/secrets
          generateSarif: "true"

      - name: Upload Semgrep SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ─────────────────────────── GATE 2 ───────────────────────────
  hadolint:
    name: "Gate 2 - Dockerfile Security Audit (Hadolint)"
    needs: [sast]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint (SARIF + fail on warnings)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: build/Dockerfile
          config: build/.hadolint.yaml
          format: sarif
          output-file: hadolint.sarif
          failure-threshold: warning

      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint.sarif
          category: hadolint

  # ─────────────────────────── GATE 3 ───────────────────────────
  build-scan:
    name: "Gate 3 - Multi-arch Build & Trivy Scan"
    needs: [hadolint]
    # OIDC trust is scoped to refs/heads/main, so AWS jobs only run on push.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image reference (immutable tag = commit SHA)
        id: meta
        run: echo "image_ref=${ECR_REPOSITORY}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          provenance: true
          sbom: false   # richer SBOM generated with Syft in Gate 4

      - name: Trivy scan - FAIL on CRITICAL/HIGH
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"                 # non-zero => job fails => gate blocks
          trivyignores: security/trivy/.trivyignore

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

  # ─────────────────────────── GATE 4 ───────────────────────────
  sbom:
    name: "Gate 4 - SBOM Generation (Syft)"
    needs: [build-scan]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOMs (SPDX + CycloneDX)
        env:
          IMG: ${{ env.ECR_REPOSITORY }}@${{ needs.build-scan.outputs.image_digest }}
        run: |
          syft "$IMG" -o spdx-json=sbom.spdx.json
          syft "$IMG" -o cyclonedx-json=sbom.cyclonedx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
          retention-days: 90

  # ─────────────────────────── GATE 5 ───────────────────────────
  sign:
    name: "Gate 5 - Keyless Signing & Attestation (Cosign)"
    needs: [build-scan, sbom]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC identity for Fulcio (keyless)
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.6.0
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Keyless sign the image (by digest)
        env:
          COSIGN_YES: "true"   # non-interactive; use the ambient OIDC token
          IMG: ${{ env.ECR_REPOSITORY }}@${{ needs.build-scan.outputs.image_digest }}
        run: cosign sign "$IMG"

      - name: Attach SBOM attestation (CycloneDX predicate)
        env:
          COSIGN_YES: "true"
          IMG: ${{ env.ECR_REPOSITORY }}@${{ needs.build-scan.outputs.image_digest }}
        run: cosign attest --predicate sbom.cyclonedx.json --type cyclonedx "$IMG"

  # ─────────────────────────── GATE 6 ───────────────────────────
  policy-gate:
    name: "Gate 6 - Policy-as-Code Compliance (OPA/Conftest)"
    needs: [build-scan, sign]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.6.0
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Install Conftest
        run: |
          CONFTEST_VERSION=0.56.0
          curl -sSfL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp conftest
          sudo mv /tmp/conftest /usr/local/bin/

      - name: Verify signature (identity + issuer bound)
        env:
          IMG: ${{ env.ECR_REPOSITORY }}@${{ needs.build-scan.outputs.image_digest }}
          EXPECTED_IDENTITY: "https://github.com/${{ github.repository }}/.github/workflows/devsecops-pipeline.yaml@refs/heads/main"
        run: |
          cosign verify "$IMG" \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > /dev/null
          echo "signature verified"

      - name: Build policy input (image config + attestation facts)
        env:
          IMG: ${{ env.ECR_REPOSITORY }}@${{ needs.build-scan.outputs.image_digest }}
        run: |
          if cosign verify-attestation "$IMG" --type cyclonedx \
               --certificate-identity-regexp ".*" \
               --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
               > /dev/null 2>&1; then
            HAS_SBOM=true
          else
            HAS_SBOM=false
          fi

          docker pull "$IMG" > /dev/null 2>&1 || true
          USER_FIELD=$(docker image inspect "$IMG" --format '{{.Config.User}}' 2>/dev/null || echo "65532")

          jq -n \
            --arg user "${USER_FIELD:-65532}" \
            --arg digest "${{ needs.build-scan.outputs.image_digest }}" \
            --argjson signed true \
            --argjson has_sbom "$HAS_SBOM" \
            '{image: {user: $user, digest: $digest, signed: $signed, sbom_attested: $has_sbom, base_image: "gcr.io/distroless/static-debian12"}}' \
            > policy_input.json
          cat policy_input.json

      - name: Conftest policy evaluation (blocks non-compliant builds)
        run: conftest test policy_input.json --policy policy/ --all-namespaces
